<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- project-detail.js replaces this with the project name -->
  <title>Project | CEDIM</title>

  <meta name="description" content="A CEDIM project: applied engineering developed by students at the Mechatronics Research and Development Centre of Universidad Nacional de Ingeniería." />

  <!-- OJO: estas etiquetas son genéricas y NO cambian por proyecto.
       Los rastreadores de Facebook, LinkedIn y WhatsApp no ejecutan
       JavaScript, así que nunca ven lo que project-detail.js escribe:
       leen solo este HTML. Por eso cualquier ?id= compartido muestra
       la misma vista previa. Para tener vista previa por proyecto
       habría que generar un HTML por proyecto, lo que rompería el
       "editar datos, no código" que sostiene esta arquitectura.
       Se omiten og:url y canonical a propósito: al no poder incluir
       el ?id=, fijarlos agruparía todos los proyectos en una sola
       URL para las redes. -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="CEDIM" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="CEDIM Project" />
  <meta property="og:description" content="Applied engineering developed by students at the Mechatronics Research and Development Centre of Universidad Nacional de Ingeniería." />
  <meta property="og:image" content="https://cedimunifim.github.io/cedim-web/assets/img/social/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="CEDIM — Building the Future of Mechatronics" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CEDIM Project" />
  <meta name="twitter:description" content="Applied engineering developed by students at the Mechatronics Research and Development Centre of Universidad Nacional de Ingeniería." />
  <meta name="twitter:image" content="https://cedimunifim.github.io/cedim-web/assets/img/social/og-image.png" />

  <link rel="icon" href="assets/img/logos/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/logos/apple-touch-icon.png" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>

  <div id="site-navbar"></div>

  <main class="page" id="main-content">
    <!-- Rendered by components/project-detail/project-detail.js -->
    <div class="container" id="project-content"></div>
  </main>

  <div id="site-footer"></div>

  <script src="components/site-chrome/site-chrome.js"></script>
  <script src="components/navbar/navbar.js"></script>
  <script src="components/footer/footer.js"></script>

  <script src="assets/js/data/projects.js"></script>
  <script src="components/project-detail/project-detail.js"></script>
  <script src="components/reveal/reveal.js"></script>
</body>
</html>
