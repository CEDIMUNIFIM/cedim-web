  <text x="90" y="392" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#94A3B8">Mechatronics Research and Development Centre</text>

  <text x="90" y="434" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#94A3B8">Universidad Nacional de Ingeniería</text>

  <rect x="90" y="486" width="120" height="6" rx="3" fill="#38BDF8"/>

  <!-- Brazo robótico, mismo trazo que las ilustraciones de proyecto -->
